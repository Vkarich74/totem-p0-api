name: US-PAY-C11 final Backend SDK PostgreSQL17 isolated staging

on:
  push:
    branches:
      - feature/us-pay-c11-read-contract
    paths:
      - migrations/2026_11_17__us_pay_c11_price_collector_sidecars.sql
      - tests/sql/us_pay_c11_stage_fixture.sql
      - tests/sql/us_pay_c11_stage_acceptance.sql
      - tests/sql/us_pay_c11_api_seed.sql
      - tests/sql/us_pay_c11_final_token_fixture.sql
      - migrations/2026_11_17__us_pay_c11_collector_selection_audit.sql
      - tests/sql/us_pay_c11_owner_auth_fixture.sql
      - migrations/2026_11_17__us_pay_c11_stripe_test_event_sidecars.sql
      - tests/sql/us_pay_c11_stripe_test_stage_seed.sql
      - tests/usPayC11StripeTest.integration.test.js
      - src/services/usStripeTestVerification.js
      - src/services/usStripeTestBinding.service.js
      - src/services/usStripeTestWebhook.service.js
      - src/routes/usStripeTestWebhook.js
      - src/app.js
      - migrations/2026_11_17__us_pay_c11_live_seller_onboarding.sql
      - tests/sql/us_pay_c11_live_connect_fixture.sql
      - tests/usPayC11LiveConnect.integration.test.js
      - src/services/usPayC11LiveStripeApi.js
      - src/services/usPayC11LiveSellerOnboarding.service.js
      - src/routes/internalUsPayC11LiveSeller.js
      - tests/usPayC11Owner.integration.test.js
      - src/services/usPayC11OwnerCollector.service.js
      - src/routes/internalUsPayC11Owner.js
      - src/routes/internal.js
      - tests/usPayC11Api.integration.test.js
      - tests/usPayC11FinalStage.server.js
      - tests/usPayC11FinalStage.browser.test.js
      - src/services/clientCabinetTokenAccess.js
      - src/services/usPayC11ReadModel.js
      - src/services/usPayC11ReadModel.test.js
      - src/services/usPayC11ReadService.js
      - src/services/usPayC11ReadService.test.js
      - src/routes/publicUsPayC11.js
      - src/routes/public.js
      - .github/workflows/us-pay-c11-db-staging.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-repository-staging:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout Backend C11 feature branch
        uses: actions/checkout@v4

      - name: Checkout frozen SDK C11 feature commit
        uses: actions/checkout@v4
        with:
          repository: Vkarich74/totem-sdk
          ref: 320e2a9fbaf803d9416bb6bc877f56f20f2ebdc0
          path: sdk
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Start disposable PostgreSQL 17 (synthetic database only)
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -d --name us-pay-c11-pg17 \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_DB=us_pay_c11_staging \
            -e POSTGRES_USER=uspayc11 \
            -e POSTGRES_PASSWORD=local_ci_fake_secret \
            postgres:17
          for attempt in $(seq 1 30); do
            if docker exec us-pay-c11-pg17 pg_isready -U uspayc11 -d us_pay_c11_staging >/dev/null 2>&1; then
              exit 0
            fi
            sleep 1
          done
          docker logs us-pay-c11-pg17
          exit 1

      - name: Install synthetic schema and US-only sidecars
        run: |
          set -euo pipefail
          for file in \
            tests/sql/us_pay_c11_stage_fixture.sql \
            migrations/2026_11_17__us_pay_c11_price_collector_sidecars.sql \
            tests/sql/us_pay_c11_stage_acceptance.sql \
            tests/sql/us_pay_c11_api_seed.sql \
            tests/sql/us_pay_c11_final_token_fixture.sql \
            migrations/2026_11_17__us_pay_c11_collector_selection_audit.sql \
            tests/sql/us_pay_c11_owner_auth_fixture.sql \
            migrations/2026_11_17__us_pay_c11_stripe_test_event_sidecars.sql \
            tests/sql/us_pay_c11_stripe_test_stage_seed.sql \
            migrations/2026_11_17__us_pay_c11_live_seller_onboarding.sql \
            tests/sql/us_pay_c11_live_connect_fixture.sql; do
            docker exec -i us-pay-c11-pg17 psql -X -U uspayc11 -d us_pay_c11_staging \
              -v ON_ERROR_STOP=1 < "$file" > /tmp/us-pay-c11-sql-output.txt
            tail -n 4 /tmp/us-pay-c11-sql-output.txt
          done
          echo 'US_PAY_C11_STAGING_SQL_PASS'

      - name: Install Backend and SDK dependencies
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          cd sdk
          npm ci --ignore-scripts --no-audit --no-fund

      - name: Verify existing Backend contract and SQL integration tests
        env:
          US_PAY_C11_TEST_DATABASE_URL: postgres://uspayc11:local_ci_fake_secret@127.0.0.1:55432/us_pay_c11_staging
          US_PAY_C11_STRIPE_TEST_MODE: 'true'
        run: |
          set -euo pipefail
          node --check src/routes/public.js
          node --check src/app.js
          node --check src/routes/usStripeTestWebhook.js
          node --check src/services/usStripeTestWebhook.service.js
          node --check src/services/usStripeTestVerification.js
          node --check src/services/usStripeTestBinding.service.js
          node --check src/services/usPayC11LiveStripeApi.js
          node --check src/services/usPayC11LiveSellerOnboarding.service.js
          node --check src/routes/internalUsPayC11LiveSeller.js
          node --check src/routes/internal.js
          node --check src/routes/internalUsPayC11Owner.js
          node --check src/services/usPayC11OwnerCollector.service.js
          node --test \
            src/services/usPayC11ReadModel.test.js \
            src/services/usPayC11ReadService.test.js \
            tests/usPayC11Api.integration.test.js \
            tests/usPayC11Owner.integration.test.js
          echo 'US_PAY_C11_BACKEND_REGRESSION_PASS'

      - name: Build actual US SDK with isolated local Backend URL
        env:
          VITE_API_BASE: http://127.0.0.1:4123
        run: |
          set -euo pipefail
          cd sdk
          npm run build
          test -f dist/index.html
          node --test src/client/usPayC11Model.test.js
          echo 'US_PAY_C11_SDK_STAGING_BUILD_PASS'

      - name: Install only Chromium for interactive browser acceptance
        run: |
          set -euo pipefail
          cd sdk
          npx playwright install --with-deps chromium

      - name: Start real C11 Backend router and SDK preview (loopback)
        env:
          US_PAY_C11_TEST_DATABASE_URL: postgres://uspayc11:local_ci_fake_secret@127.0.0.1:55432/us_pay_c11_staging
          US_PAY_C11_STRIPE_TEST_MODE: 'true'
        run: |
          set -euo pipefail
          node tests/usPayC11FinalStage.server.js > /tmp/us-pay-c11-api.log 2>&1 &
          echo "$!" > /tmp/us-pay-c11-api.pid
          (cd sdk && npm run preview -- --host 127.0.0.1 --port 4173 --strictPort) \
            > /tmp/us-pay-c11-sdk.log 2>&1 &
          echo "$!" > /tmp/us-pay-c11-sdk.pid
          for attempt in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:4123/stage/health >/dev/null 2>&1 &&
               curl -fsS http://127.0.0.1:4173/ >/dev/null 2>&1; then
              echo 'US_PAY_C11_STAGING_SERVERS_READY'
              exit 0
            fi
            sleep 1
          done
          cat /tmp/us-pay-c11-api.log /tmp/us-pay-c11-sdk.log
          exit 1

      - name: One combined Chromium Backend SDK PostgreSQL acceptance
        env:
          US_PAY_C11_TEST_DATABASE_URL: postgres://uspayc11:local_ci_fake_secret@127.0.0.1:55432/us_pay_c11_staging
        run: |
          set -euo pipefail
          node --test tests/usPayC11FinalStage.browser.test.js
          echo 'US_PAY_C11_FINAL_E2E_PASS'

      - name: Verify signed Stripe TEST webhook against US-only PostgreSQL17
        env:
          US_PAY_C11_TEST_DATABASE_URL: postgres://uspayc11:local_ci_fake_secret@127.0.0.1:55432/us_pay_c11_staging
          US_PAY_C11_STRIPE_TEST_MODE: 'true'
        run: |
          set -euo pipefail
          node --test tests/usPayC11StripeTest.integration.test.js
          echo 'US_PAY_C11_STRIPE_TEST_SIGNATURE_BINDING_PASS'

      - name: Real HTTP + PostgreSQL authorized LIVE seller consent (Stripe API stub only)
        env:
          US_PAY_C11_TEST_DATABASE_URL: postgres://uspayc11:local_ci_fake_secret@127.0.0.1:55432/us_pay_c11_staging
          US_PAY_C11_STRIPE_TEST_MODE: 'true'
        run: |
          set -euo pipefail
          test -z "${US_PAY_C11_LIVE_STRIPE_SECRET_KEY:-}"
          node --test tests/usPayC11LiveConnect.integration.test.js
          echo 'US_PAY_C11_LIVE_SELLER_ONBOARDING_CONTRACT_PASS'

      - name: Assert three US sidecars and no Stripe checkout enablement
        run: |
          set -euo pipefail
          COUNT=$(docker exec us-pay-c11-pg17 psql -X -U uspayc11 -d us_pay_c11_staging \
            -tAc "SELECT COUNT(*) FROM pg_catalog.pg_tables WHERE schemaname='public' AND tablename IN ('us_service_price_amounts','us_booking_price_snapshots','us_booking_payment_collectors')")
          test "$COUNT" = 3
          ! grep -E '(PaymentIntent|checkout\.sessions|/payments/create)' \
            sdk/src/client/usPayC11Client.js sdk/src/client/usPayC11Model.js
          echo 'US_PAY_C11_NO_PAYMENT_WRITES_PASS'

      - name: Shut down stage and destroy disposable PostgreSQL 17
        if: always()
        run: |
          if [ -f /tmp/us-pay-c11-api.pid ]; then kill "$(cat /tmp/us-pay-c11-api.pid)" 2>/dev/null || true; fi
          if [ -f /tmp/us-pay-c11-sdk.pid ]; then kill "$(cat /tmp/us-pay-c11-sdk.pid)" 2>/dev/null || true; fi
          docker rm -f us-pay-c11-pg17 >/dev/null 2>&1 || true
          echo 'US_PAY_C11_STAGING_DESTROYED'
