name: KG shared owner master isolated PostgreSQL (no deploy)
on:
  pull_request:
    branches: [main, security-auth-session-cutover-20261124]
    paths:
      - 'src/services/provision/kgSharedMasterIdentity.js'
      - 'src/services/provision/createMasterCanonical.js'
      - 'src/routes/internal/adminOpenOwner.js'
      - 'src/routes/internal.js'
      - 'src/routes/internal/masters.js'
      - 'src/middleware/resolveAuth.js'
      - 'tests/kg-shared-master-postgres.test.mjs'
      - 'tests/sql/kg-shared-master-schema.sql'
      - '.github/workflows/kg-shared-master.yml'
permissions:
  contents: read
jobs:
  kg-master:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fixture
          POSTGRES_PASSWORD: fixture_only
          POSTGRES_DB: kg_shared_master_test
        ports:
          - 55434:5432
        options: >-
          --health-cmd "pg_isready -U fixture -d kg_shared_master_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: ""
      KG_SHARED_MASTER_ISOLATED: "YES"
      KG_TEST_DATABASE_URL: postgresql://fixture:fixture_only@127.0.0.1:55434/kg_shared_master_test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - run: |
          node --check src/routes/internal/adminOpenOwner.js
          node --check src/routes/internal.js
          node --check src/middleware/resolveAuth.js
          node --check src/services/provision/kgSharedMasterIdentity.js
          node --test tests/kg-shared-master-postgres.test.mjs
