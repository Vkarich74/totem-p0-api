name: Admin market contract B / isolated regression

on:
  push:
    branches:
      - "release/admin-market-contract-b-*"
    paths:
      - "src/routes/internal/admin.js"
      - "src/routes/internal/adminMarketsContract.js"
      - "src/tests/adminMarketsContract.test.mjs"
      - "src/tests/adminMarketSqlSmoke.test.mjs"
      - ".github/workflows/admin-market-contract-b.yml"
  pull_request:
    paths:
      - "src/routes/internal/admin.js"
      - "src/routes/internal/adminMarketsContract.js"
      - "src/tests/adminMarketsContract.test.mjs"
      - "src/tests/adminMarketSqlSmoke.test.mjs"
      - ".github/workflows/admin-market-contract-b.yml"

permissions:
  contents: read

jobs:
  market-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: admin_market_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d admin_market_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Install declared dependencies, no lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Syntax of complete Backend files
        run: |
          node --check src/routes/internal/admin.js
          node --check src/routes/internal/adminMarketsContract.js
          node --check src/tests/adminMarketsContract.test.mjs
          node --check src/tests/adminMarketSqlSmoke.test.mjs
      - name: KG/US/KZ contract and empty-schema PostgreSQL smoke
        env:
          PGTEST_URL: postgresql://ci:ci@localhost:5432/admin_market_ci
        run: node --test src/tests/adminMarketsContract.test.mjs src/tests/adminMarketSqlSmoke.test.mjs
