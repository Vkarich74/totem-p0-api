name: Admin market contract B / isolated regression

on:
  push:
    branches:
      - "release/admin-market-contract-b-*"
    paths:
      - "src/routes/internal/admin.js"
      - "src/routes/internal/adminMarketsContract.js"
      - "src/tests/adminMarketsContract.test.mjs"
      - ".github/workflows/admin-market-contract-b.yml"
  pull_request:
    paths:
      - "src/routes/internal/admin.js"
      - "src/routes/internal/adminMarketsContract.js"
      - "src/tests/adminMarketsContract.test.mjs"
      - ".github/workflows/admin-market-contract-b.yml"

permissions:
  contents: read

jobs:
  market-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax of complete Backend files
        run: |
          node --check src/routes/internal/admin.js
          node --check src/routes/internal/adminMarketsContract.js
          node --check src/tests/adminMarketsContract.test.mjs
      - name: Verify server market scope without database or production writes
        run: node --test src/tests/adminMarketsContract.test.mjs
