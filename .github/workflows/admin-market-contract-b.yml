name: Admin market contract B / source-only regression

on:
  push:
    branches:
      - "release/admin-market-contract-b-*"
    paths:
      - "src/routes/internal/admin.js"
      - "src/routes/internal/adminMarketsContract.js"
      - "src/routes/internal/adminOpenOwner.js"
      - ".github/workflows/admin-market-contract-b.yml"
  pull_request:
    paths:
      - "src/routes/internal/admin.js"
      - "src/routes/internal/adminMarketsContract.js"
      - "src/routes/internal/adminOpenOwner.js"
      - ".github/workflows/admin-market-contract-b.yml"

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax of full market and admin contracts
        run: |
          node --check src/routes/internal/admin.js
          node --check src/routes/internal/adminMarketsContract.js
          node --check src/routes/internal/adminOpenOwner.js
      - name: Enforce zero business fixtures and zero SQL writes
        run: |
          echo "STATIC ONLY: no PostgreSQL service, migrations, SQL DDL, business fixtures, user creation or payment operations."
