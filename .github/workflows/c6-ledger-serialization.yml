name: C6 ledger serialization - PostgreSQL 17
on:
  pull_request:
    branches: [c6-withdraw-atomicity-ci-20261125]
    types: [opened, synchronize, reopened]
permissions:
  contents: read
jobs:
  ledger:
    if: github.head_ref == 'c6-ledger-serialization-ci-20261125'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: g5_fixture
          POSTGRES_PASSWORD: g5_fixture_only
          POSTGRES_DB: c6_ledger
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U g5_fixture -d c6_ledger"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    env:
      NODE_ENV: test
      DB_MODE: POSTGRES
      DATABASE_URL: ""
      C6_LEDGER_ISOLATED: "YES"
      G5_TEST_DATABASE_URL: postgresql://g5_fixture:g5_fixture_only@127.0.0.1:55432/c6_ledger
      MONEY_CORE_ENABLED: "true"
      MONEY_CORE_READ_ONLY: "false"
      MONEY_CORE_WRITE_ENABLED: "true"
      MONEY_CORE_LEDGER_MOVEMENTS_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Verify exact candidate
        run: |
          node --input-type=module <<'JS'
          import {readFileSync} from 'node:fs';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          import assert from 'node:assert/strict';
          const m=JSON.parse(readFileSync('tests/c6-ledger-manifest.json','utf8'));
          assert.equal(m.files.length,7);assert.equal(m.release,'HOLD');
          for(const f of m.files){
            assert.equal(createHash('sha256').update(readFileSync(f.path)).digest('hex'),f.candidate_sha256,f.path);
            execFileSync(process.execPath,['--check',f.path]);
          }
          assert.equal(createHash('sha256').update(readFileSync('tests/sql/c6-ledger-schema.sql')).digest('hex'),'82ea8f71566da69bc907dba330ebef13b928cc12fe7cb836502f0fa1e95eb7ae');
          console.log('C6_LEDGER_7_OF_7_VERIFIED');
          JS
      - name: New real PG cross-writer concurrency tests
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec -i "$PG_CONTAINER" psql -X -U g5_fixture -d c6_ledger -v ON_ERROR_STOP=1 < tests/sql/c6-held-schema.sql
          docker exec -i "$PG_CONTAINER" psql -X -U g5_fixture -d c6_ledger -v ON_ERROR_STOP=1 < tests/sql/c6-ledger-schema.sql
          node --experimental-test-module-mocks --test tests/c6-ledger-serialization.test.mjs
