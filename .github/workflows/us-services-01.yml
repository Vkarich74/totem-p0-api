name: US-SERVICES-01 scoped service creation and USD attachment
on:
  push:
    branches:
      - release/us-services-01-scoped-links-20261119
  pull_request:
    paths:
      - src/services/usServiceLink.service.js
      - src/routes/internalUsServicePrices.js
      - src/routes/internal/masters.js
      - src/routes/internal/salons.js
      - src/tests/usServiceLinkScoped.test.mjs
      - tests/sql/us_services_01_isolated_fixture.sql
      - tests/usServiceLinksPostgres.test.mjs
      - audits/us-services-01-production-schema-read-only.sql
      - .github/workflows/us-services-01.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  us-services-01:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      NODE_ENV: test
      DATABASE_URL: ""
      REDIS_URL: ""
      RAILWAY_TOKEN: ""
      US_PAY_C11_LIVE_STRIPE_SECRET_KEY: ""
      US_PAY_C11_LIVE_PAYMENTS_ENABLED: "false"
      US_PAY_C11_LIVE_REFUNDS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Isolated dependency installation
        run: npm ci --include=dev --ignore-scripts --no-audit --no-fund
      - name: Complete-file syntax check
        run: |
          set -euo pipefail
          node --check src/services/usServiceLink.service.js
          node --check src/routes/internalUsServicePrices.js
          node --check src/routes/internal/masters.js
          node --check src/routes/internal/salons.js
          node --check src/tests/usServiceLinkScoped.test.mjs
          node --check tests/usServiceLinksPostgres.test.mjs
      - name: Scope and atomicity offline regression
        run: |
          set -euo pipefail
          test -z "$DATABASE_URL"
          test -z "$US_PAY_C11_LIVE_STRIPE_SECRET_KEY"
          node --experimental-test-module-mocks --test src/tests/usServiceLinkScoped.test.mjs
      - name: Disposable PostgreSQL17 owner transaction acceptance
        env:
          US_SERVICES_01_TEST_DB: postgres://usservices01:local_fake_secret@127.0.0.1:55432/us_services_01_test
        run: |
          set -euo pipefail
          test -z "${DATABASE_URL:-}"
          docker run --rm -d --name us-services-01-pg17 \
            -p 127.0.0.1:55432:5432 \
            -e POSTGRES_DB=us_services_01_test \
            -e POSTGRES_USER=usservices01 \
            -e POSTGRES_PASSWORD=local_fake_secret \
            postgres:17
          for i in $(seq 1 45); do
            if docker exec us-services-01-pg17 pg_isready -U usservices01 -d us_services_01_test >/dev/null 2>&1; then break; fi
            sleep 1
          done
          docker exec -i us-services-01-pg17 psql -X -v ON_ERROR_STOP=1 \
            -U usservices01 -d us_services_01_test \
            < tests/sql/us_services_01_isolated_fixture.sql
          node --experimental-test-module-mocks --test tests/usServiceLinksPostgres.test.mjs
          docker exec -i us-services-01-pg17 psql -X -v ON_ERROR_STOP=1 \
            -U usservices01 -d us_services_01_test -At -F '|' \
            < audits/us-services-01-production-schema-read-only.sql \
            > /tmp/us-services-01-schema-preflight.txt
          grep -Fq 'SCHEMA_PASS_RELEASE_GATE_1' /tmp/us-services-01-schema-preflight.txt
          ! grep -Fq '|BLOCK|' /tmp/us-services-01-schema-preflight.txt
          grep -Fq '|on|' /tmp/us-services-01-schema-preflight.txt
          echo "US_SERVICES_01_SCHEMA_AUDIT_SYNTHETIC_PASS"
          echo "US_SERVICES_01_PG17_SYNTHETIC_PASS"
      - name: Existing US catalog booking and owner regressions
        run: |
          set -euo pipefail
          node --experimental-test-module-mocks --test src/tests/usCabinetBookingBoundary.test.mjs src/tests/usPublicServicePriceCatalog.test.mjs src/tests/usHoursServicesSlotsAvailability.test.mjs src/tests/bookingOwnerAllMarketsRegression.test.mjs src/tests/usMasterWorkingHours.test.mjs
      - name: No migration or Stripe LIVE capabilities added
        run: |
          set -euo pipefail
          test -z "$DATABASE_URL"
          test -z "$REDIS_URL"
          ! grep -Eq 'stripe\.paymentIntents|stripe\.refunds' src/services/usServiceLink.service.js
          grep -Fq 'US_SERVICE_LINK_ENDPOINT_REQUIRED' src/services/usServiceLink.service.js
          grep -Fq "VALUES (\$1,\$2,\$3,0,\$4,true,'USD')" src/services/usServiceLink.service.js
          echo "US_SERVICES_01_OFFLINE_SAFE"
